<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeuroLearn — Mouse Learning Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f5f0;--surface:#ffffff;--border:#e8e4dc;--border2:#d4cfc4;
  --text:#1a1814;--muted:#7a7468;--accent:#2d6a4f;--accent2:#1e4d8c;
  --warn:#c05a1a;--vision:#1e4d8c;--audio:#c05a1a;
  --green:#2d6a4f;--red:#b52a2a;
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.6;min-height:100vh}

nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 40px;display:flex;align-items:center;height:52px;position:sticky;top:0;z-index:100}
.nav-brand{font-family:var(--mono);font-size:15px;font-weight:500;letter-spacing:-0.01em}
.nav-brand span{color:var(--accent)}

.wrap{max-width:900px;margin:0 auto;padding:40px 40px 64px}

.mouse-bar{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px 20px;display:flex;align-items:center;gap:14px;margin-bottom:24px;flex-wrap:wrap}
.mouse-chip{padding:7px 16px;border-radius:100px;border:1.5px solid var(--border2);background:transparent;font-family:var(--mono);font-size:12px;cursor:pointer;color:var(--muted);transition:all .15s;white-space:nowrap}
.mouse-chip:hover{border-color:var(--accent);color:var(--accent)}
.mouse-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}

.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
@media(max-width:540px){.stat-row{grid-template-columns:1fr 1fr}}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px 18px 14px}
.stat-card .label{font-size:11px;color:var(--muted);font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.stat-card .value{font-size:28px;font-weight:300;letter-spacing:-0.02em}
.stat-card .sub{font-size:12px;color:var(--muted);margin-top:2px}
.val-green{color:var(--green)}
.val-blue{color:var(--accent2)}
.val-orange{color:var(--warn)}

.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:24px}
.chart-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap;gap:8px}
.chart-title{font-size:15px;font-weight:500;letter-spacing:-0.01em}
.chart-desc{font-size:12px;color:var(--muted);margin-top:2px}
.legend{display:flex;gap:16px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.legend-line{width:20px;height:2px;flex-shrink:0;border-radius:1px}
canvas{display:block;width:100%!important}

#tt{position:fixed;background:var(--surface);border:1px solid var(--border2);border-radius:6px;padding:10px 14px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .1s;z-index:999;line-height:1.8;min-width:160px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
#tt.show{opacity:1}
#tt .tt-head{font-family:var(--mono);font-size:10px;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:4px;margin-bottom:4px;letter-spacing:.06em}
#tt .tt-row{display:flex;justify-content:space-between;gap:16px}
#tt .tt-k{color:var(--muted)}
#tt .tt-v{font-weight:500}
</style>
</head>
<body>

<div id="tt"><div class="tt-head" id="tt-head"></div><div id="tt-body"></div></div>

<nav>
  <div class="nav-brand">Neuro<span>Learn</span></div>
</nav>


<div class="wrap">
  <div class="mouse-bar">
    <!-- <button class="mouse-chip" onclick="selectMouse('GR010',event)">GR010 — Complete</button> -->
    <button class="mouse-chip active" onclick="selectMouse('GR011',event)">GR011 — In Training</button>
  </div>

  <div class="stat-row" id="stat-row"></div>

  <div class="chart-card">
    <div class="chart-header">
      <div>
        <div class="chart-title">Learning trajectory</div>
        <div class="chart-desc">Performance over sessions — colored by modality · dashed lines = phase boundaries</div>
      </div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--accent2)"></div>Vision</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--warn)"></div>Audio</div>
        <div class="legend-item"><div class="legend-line" style="background:var(--accent)"></div>Rolling avg</div>
      </div>
    </div>
    <canvas id="c-perf" height="260"></canvas>
  </div>
</div>

  r.last_block_perf_roll5 = win.reduce((a, b) => a + b, 0) / win.length;
});
// Compute 5-session rolling average in JS
GR011.forEach((r, i) => {
  const win = GR011.slice(Math.max(0, i - 4), i + 1)
    .map(x => x.last_block_perf).filter(v => v != null);
  r.last_block_perf_roll5 = win.reduce((a, b) => a + b, 0) / win.length;
});
// Compute 5-session rolling average in JS
GR011.forEach((r, i) => {
  const win = GR011.slice(Math.max(0, i - 4), i + 1)
    .map(x => x.last_block_perf).filter(v => v != null);
  r.last_block_perf_roll5 = win.reduce((a, b) => a + b, 0) / win.length;
});

// Compute 5-session rolling average in JS
GR011.forEach((r, i) => {
  const win = GR011.slice(Math.max(0, i - 4), i + 1)
    .map(x => x.last_block_perf).filter(v => v != null);
  r.last_block_perf_roll5 = win.reduce((a, b) => a + b, 0) / win.length;
});

const GR010_SUMMARY = {
  sessions:135, phases:28, finalPerf:0.66, lastMod:'Vision',
  lastSwitch:1, phase:28, sip:1, dtn:0, prog:1.0, rt:0.165,
  trials:540, engage:0.95, done:true
};

let currentMouse = 'GR011';
let currentData  = GR011;

const tt = document.getElementById('tt');
function showTT(e, head, rows) {
  document.getElementById('tt-head').textContent = head;
  document.getElementById('tt-body').innerHTML = rows.map(r =>
    `<div class="tt-row"><span class="tt-k">${r[0]}</span><span class="tt-v">${r[1]??'—'}</span></div>`
  ).join('');
  tt.style.left = (e.clientX+12)+'px';
  tt.style.top  = (e.clientY-8)+'px';
  tt.classList.add('show');
}
function hideTT(){ tt.classList.remove('show'); }
function fmtDate(s){ const str=String(s); return str.length===8?str.replace(/(\d{4})(\d{2})(\d{2})/,'$1-$2-$3'):str; }

function selectMouse(id, event) {
  currentMouse = id;
  document.querySelectorAll('.mouse-chip').forEach(c=>c.classList.remove('active'));
  event.target.classList.add('active');
  currentData = (id === 'GR011') ? GR011 : null;
  render();
}

function render() {
  if (!currentData) { renderGR010Summary(); return; }
  const D = currentData;
  const last = D[D.length-1];

  const avgPerf = D.reduce((s,r)=>s+(r.last_block_perf||0),0)/D.length;

  document.getElementById('stat-row').innerHTML = `
    <div class="stat-card"><div class="label">Sessions</div><div class="value val-blue">${D.length}</div><div class="sub">training days</div></div>
    <div class="stat-card"><div class="label">Avg performance</div><div class="value val-green">${(avgPerf*100).toFixed(0)}%</div><div class="sub">per phase avg</div></div>
    <div class="stat-card"><div class="label">Days to switch</div><div class="value val-orange">${last.days_to_next_switch!=null?last.days_to_next_switch.toFixed(1):'?'}</div><div class="sub">model prediction (GR010)</div></div>
  `;

  drawPerfChart(D);
}

function renderGR010Summary() {
  const S = GR010_SUMMARY;
  const avgPerfPct = (S.finalPerf*100).toFixed(0);
  document.getElementById('stat-row').innerHTML = `
    <div class="stat-card"><div class="label">Sessions</div><div class="value val-blue">${S.sessions}</div><div class="sub">training days</div></div>
    <div class="stat-card"><div class="label">Final performance</div><div class="value val-green">${avgPerfPct}%</div><div class="sub">per phase avg</div></div>
    <div class="stat-card"><div class="label">Days to switch</div><div class="value val-orange">—</div><div class="sub">training complete</div></div>
  `;
  const canvas = document.getElementById('c-perf');
  canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);
}

function setupCanvas(id) {
  const canvas = document.getElementById(id);
  const dpr = window.devicePixelRatio||1;
  const w = canvas.parentElement.offsetWidth - 48;
  const h = parseInt(canvas.getAttribute('height'));
  canvas.width  = w*dpr; canvas.height = h*dpr;
  canvas.style.width=w+'px'; canvas.style.height=h+'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  return {ctx,w,h};
}
function pad(w,h){return{x0:52,y0:16,x1:w-16,y1:h-32,pw:w-68,ph:h-48}}
function mx(d,days,a){const mn=days[0],mx2=days[days.length-1];return a.x0+(d-mn)/(mx2-mn)*a.pw}
function my(v,mn,mx2,a){return a.y1-(v-mn)/(mx2-mn)*a.ph}
function drawAxes(ctx,a,yTicks,yMax,days,D){
  ctx.font='10px DM Mono,monospace';
  ctx.fillStyle='#7a7468';
  yTicks.forEach(v=>{
    const y=my(v,0,yMax,a);
    ctx.textAlign='right';
    ctx.fillText(typeof v==='number'&&v<2?(v*100).toFixed(0)+'%':v,a.x0-6,y+3);
    ctx.strokeStyle='#e8e4dc';ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(a.x0,y);ctx.lineTo(a.x1,y);ctx.stroke();
  });
  const step=Math.ceil(D.length/8);
  ctx.textAlign='center';
  D.forEach((r,i)=>{
    if(i%step===0){
      const x=mx(r.day_index,days,a);
      ctx.fillText('D'+r.day_index,x,a.y1+16);
    }
  });
  ctx.strokeStyle='#d4cfc4';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(a.x0,a.y0);ctx.lineTo(a.x0,a.y1);ctx.stroke();
  ctx.beginPath();ctx.moveTo(a.x0,a.y1);ctx.lineTo(a.x1,a.y1);ctx.stroke();
}
function drawPhases(ctx,a,days,D){
  let lastP=D[0].phase_id;
  D.forEach((r,i)=>{
    if(r.phase_id!==lastP){
      const x=mx(r.day_index,days,a);
      ctx.strokeStyle='rgba(200,190,170,.4)';ctx.lineWidth=1;
      ctx.setLineDash([3,3]);
      ctx.beginPath();ctx.moveTo(x,a.y0);ctx.lineTo(x,a.y1);ctx.stroke();
      ctx.setLineDash([]);
      lastP=r.phase_id;
    }
  });
}

function drawPerfChart(D){
  const {ctx,w,h}=setupCanvas('c-perf');
  const a=pad(w,h);
  const days=D.map(r=>r.day_index);
  drawAxes(ctx,a,[0,0.25,0.5,0.75,1.0],1,days,D);
  drawPhases(ctx,a,days,D);
  ctx.beginPath();let s2=false;
  D.forEach((r,i)=>{
    const v=r.last_block_perf_roll5??r.last_block_perf;
    if(v==null){s2=false;return;}
    const x=mx(r.day_index,days,a),y=my(v,0,1,a);
    s2?ctx.lineTo(x,y):ctx.moveTo(x,y);s2=true;
  });
  ctx.strokeStyle='#2d6a4f';ctx.lineWidth=2;ctx.stroke();
  D.forEach(r=>{
    const v=r.last_block_perf;if(v==null)return;
    const x=mx(r.day_index,days,a),y=my(v,0,1,a);
    const mod=(r.session_end_mod||'').toLowerCase();
    ctx.beginPath();ctx.arc(x,y,3.5,0,Math.PI*2);
    ctx.fillStyle=mod.includes('vision')?'#1e4d8c':'#c05a1a';
    ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=0.8;ctx.stroke();
  });
  const addHoverFn = (id,days,a,D,tipFn) => {
    const canvas=document.getElementById(id);
    canvas.onmousemove=e=>{
      const r=canvas.getBoundingClientRect();
      const mx2=e.clientX-r.left;
      let bi=-1,bd=9999;
      days.forEach((d,i)=>{const dist=Math.abs(mx(d,days,a)-mx2);if(dist<bd){bd=dist;bi=i;}});
      if(bd>20){hideTT();return;}
      const {head,rows}=tipFn(bi);
      showTT(e,head,rows);
    };
    canvas.onmouseleave=hideTT;
  };
  addHoverFn('c-perf',days,a,D,i=>{
    const r=D[i];
    return{head:`Day ${r.day_index} · ${fmtDate(r.date)}`,rows:[
      ['Performance',(r.last_block_perf*100).toFixed(1)+'%'],
      ['Modality',r.session_end_mod],
      ['Phase',r.phase_id],
      ['Predicted DTN',r.days_to_next_switch!=null?r.days_to_next_switch.toFixed(1)+' sess':'—'],
    ]};
  });
}

window.addEventListener('load', () => { render(); });
window.addEventListener('resize', ()=>{ if(currentData) render(); });
</script>
